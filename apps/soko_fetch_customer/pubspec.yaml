name: soko_fetch
description: Soko Fetch - Customer App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.4.3

  # ── Auth & Security ─────────────────────────────────────────────────────────
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # ── Maps & Location ─────────────────────────────────────────────────────────
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0

  # ── Push Notifications ──────────────────────────────────────────────────────
  firebase_core: ^2.27.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^14.7.20
  flutter_local_notifications: ^17.1.2

  # ── UI ──────────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  pinput: ^4.0.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # ── WebSocket ───────────────────────────────────────────────────────────────
  web_socket_channel: ^2.4.4

  # ── Utils ───────────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  sokofetch_auth:
    path: ../../packages/sokofetch_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true




name: soko_fetch_merchant
description: Soko Fetch - Merchant Portal
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.20
  flutter_local_notifications: ^17.1.2
  audioplayers: ^6.0.0         # Order alert sound
  wakelock_plus: ^1.2.0        # Keep screen on while dashboard active
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0            # Earnings bar chart
  pinput: ^4.0.0
  intl: ^0.19.0
  timeago: ^3.6.1
  web_socket_channel: ^2.4.4
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  image_picker: ^1.1.2         # Menu item photo upload
  sokofetch_auth:
    path: ../../packages/sokofetch_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

